name: CD

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write

env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  release:
    name: Release plugin
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read plugin version
        id: version
        run: |
          VERSION="$(./gradlew --no-daemon -q printPluginVersion)"

          if [ -z "$VERSION" ]; then
            echo "::error::Could not read plugin version from Gradle"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::Release tag $TAG already exists"
            exit 1
          fi

      - name: Build plugin ZIP
        run: ./gradlew --no-daemon clean buildPlugin

      - name: Locate plugin ZIP
        id: plugin
        run: |
          shopt -s nullglob
          FILES=(build/distributions/*.zip)

          if [ "${#FILES[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one plugin ZIP in build/distributions, found ${#FILES[@]}"
            exit 1
          fi

          echo "zip=${FILES[0]}" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git tag "$TAG" "${{ github.event.workflow_run.head_sha }}"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          PLUGIN_ZIP="${{ steps.plugin.outputs.zip }}"

          gh release create "$TAG" "$PLUGIN_ZIP" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "$TAG" \
            --notes "Teal Language Support for IntelliJ IDEA $VERSION"
